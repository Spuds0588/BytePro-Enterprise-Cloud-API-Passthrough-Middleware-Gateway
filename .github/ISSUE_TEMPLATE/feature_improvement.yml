name: Feature or improvement
description: Propose the smallest change that solves a real integration problem.
title: "[Improvement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project follows YAGNI. Describe the real workflow that is blocked, not a general capability.
        Documents and conditions are the current priority; proposals elsewhere need a concrete deployment
        story. Never include API keys, invite codes, passwords, session tokens, loan data, or borrower PII.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Loan documents
        - Conditions
        - Reads and persona masking
        - Sessions and authentication
        - Onboarding portal
        - Deployment and template
        - Documentation and community
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow fails today, and who is blocked?
      placeholder: A title company needs to upload a title commitment, but ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest proposal
      description: The narrowest change that unblocks the workflow. What can be left out?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How it would be verified
      description: A local test, a sanitized BytePro shape, or a deployment report. "It would work" is not verification.
    validations:
      required: true
  - type: dropdown
    id: implementer
    attributes:
      label: Can you implement it?
      options:
        - "Yes — I can open a pull request"
        - "Partially — I can help with tests or a payload sample"
        - "No — I am reporting the need only"
    validations:
      required: true
  - type: checkboxes
    id: agreements
    attributes:
      label: Agreements
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
        - label: This request contains no API keys, invite codes, passwords, session tokens, loan data, or borrower PII.
          required: true
        - label: I understand the maintainer cannot test against a live BytePro tenant or AWS stack, and new scope must be justified under YAGNI.
          required: true

AWSTemplateFormatVersion: "2010-09-09"
Description: BytePro Enterprise Cloud API passthrough gateway (masking, FIFO writes, documents, conditions, invite portal, static egress IP).

Parameters:
  ByteBaseUrl:
    Type: String
    Default: https://api.bytesoftware.com/api/v1
  ByteAccountCode:
    Type: String
    MinLength: 1
  TitleUsername:
    Type: String
    MinLength: 1
  TitlePassword:
    Type: String
    NoEcho: true
    MinLength: 1
  BrokerUsername:
    Type: String
    MinLength: 1
  BrokerPassword:
    Type: String
    NoEcho: true
    MinLength: 1
  AppraisalUsername:
    Type: String
    MinLength: 1
  AppraisalPassword:
    Type: String
    NoEcho: true
    MinLength: 1
  TitleInviteCode:
    Type: String
    NoEcho: true
    MinLength: 24
  BrokerInviteCode:
    Type: String
    NoEcho: true
    MinLength: 24
  AppraisalInviteCode:
    Type: String
    NoEcho: true
    MinLength: 24
  LogRetentionInDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3653

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: VpcGatewayAttachment
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Gateway Lambda egress only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  TitleSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/bytepro-title-password"
      SecretString: !Ref TitlePassword

  BrokerSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/bytepro-broker-password"
      SecretString: !Ref BrokerPassword

  AppraisalSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/bytepro-appraisal-password"
      SecretString: !Ref AppraisalPassword

  TenantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: apiKeyId
          AttributeType: S
      KeySchema:
        - AttributeName: apiKeyId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: role
          AttributeType: S
      KeySchema:
        - AttributeName: role
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-writes-dlq.fifo"
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  WriteQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-writes.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 120
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: gateway-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt TenantsTable.Arn
                  - !GetAtt SessionsTable.Arn
                  - !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt WriteQueue.Arn
                  - !GetAtt DeadLetterQueue.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref TitleSecret
                  - !Ref BrokerSecret
                  - !Ref AppraisalSecret
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                Resource:
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/${UsagePlan}/keys"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/${UsagePlan}/keys/*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-gateway:*"

  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GatewayFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  GatewayFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-gateway"
      Runtime: nodejs20.x
      Handler: index.handler
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 29
      Role: !GetAtt GatewayRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          BYTE_BASE_URL: !Ref ByteBaseUrl
          BYTE_ACCOUNT_CODE: !Ref ByteAccountCode
          BYTE_TITLE_USERNAME: !Ref TitleUsername
          BYTE_BROKER_USERNAME: !Ref BrokerUsername
          BYTE_APPRAISAL_USERNAME: !Ref AppraisalUsername
          BYTE_TITLE_SECRET_ARN: !Ref TitleSecret
          BYTE_BROKER_SECRET_ARN: !Ref BrokerSecret
          BYTE_APPRAISAL_SECRET_ARN: !Ref AppraisalSecret
          TENANT_TABLE: !Ref TenantsTable
          SESSION_TABLE: !Ref SessionsTable
          JOB_TABLE: !Ref JobsTable
          WRITE_QUEUE_URL: !Ref WriteQueue
          USAGE_PLAN_ID: !Ref UsagePlan
          INVITE_TITLE: !Ref TitleInviteCode
          INVITE_BROKER: !Ref BrokerInviteCode
          INVITE_APPRAISAL: !Ref AppraisalInviteCode
          UPSTREAM_TIMEOUT_MS: "8000"
      Code:
        ZipFile: |
         "use strict";const __nativeRequire=require;const __defs={"lambda.js":(module,exports,require)=>{const{createApp}=require("./app");const{createByte}=require("./byte");const{processWrite}=require("./writes");const{log}=require("./log");function createHandler({store,env=process.env,byte,now=()=>Date.now()}){const client=byte||createByte({store,env,timeoutMs:Number(env.UPSTREAM_TIMEOUT_MS)||undefined});const app=createApp({store,byte:client,env,now});async function handleQueue(records){const batchItemFailures=[];for(const record of records){const attempts=Number(record.attributes?.ApproximateReceiveCount)||1;let jobId;try{const message=JSON.parse(record.body||"{}");jobId=message.jobId;await processWrite({job:await store.getJob(message.jobId),kind:message.kind,payload:message.payload,byte:client,store,attempts,now});}catch(err){log("WARN","WRITE_RETRY_SCHEDULED",{jobId,messageId:record.messageId,attempts,message:err.message});batchItemFailures.push({itemIdentifier:record.messageId});}}return{batchItemFailures};}return async function handler(event={}){if(Array.isArray(event.Records)&&event.Records[0]?.eventSource==="aws:sqs")return handleQueue(event.Records);return app.handle(event);};}let defaultHandler=null;exports.handler=async(event,context)=>{if(!defaultHandler){const{createAwsStore}=require("./aws-store");defaultHandler=createHandler({store:createAwsStore(process.env)});}return defaultHandler(event,context);};exports.createHandler=createHandler;},"app.js":(module,exports,require)=>{const{randomUUID}=require("node:crypto");const{log}=require("./log");const{mask}=require("./mask");const{loanData,documentList,documentContent}=require("./byte");const{roleFor,safeEqual}=require("./roles");const{renderPortal}=require("./portal");const MAX_ITEMS=100;const DEFAULT_PATHS="Property,Loan,Borrower,Milestones,Conditions,Fees,CustomFields";const MAX_DOCUMENT_BYTES=180_000;const JOB_TTL_SECONDS=30*24*60*60;const ROOT=/^[A-Za-z][A-Za-z0-9]{0,40}$/;const MAX_ROOTS=10;const WRITE_PERSONAS={fees:["TITLE_VENDOR","TPO_BROKER"],conditions:["TITLE_VENDOR","TPO_BROKER"],documents:["TITLE_VENDOR","TPO_BROKER"]};const DOCUMENT_PERSONAS=["TITLE_VENDOR","TPO_BROKER"];const OPERATION={fees:"write fees",conditions:"submit conditions",documents:"upload documents"};const json=(statusCode,body,headers={})=>({statusCode,headers:{"Content-Type":"application/json","Cache-Control":"no-store",...headers},body:JSON.stringify(body)});const error=(statusCode,message,extra={})=>json(statusCode,{error:message,...extra});const html=(statusCode,body)=>({statusCode,headers:{"Content-Type":"text/html; charset=utf-8","Cache-Control":"no-store","Content-Security-Policy":"default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'","X-Frame-Options":"DENY"},body});const decode=(value)=>{try{return decodeURIComponent(value);}catch{return value;}};const parseRoots=(raw)=>{const roots=[...new Set(String(raw||DEFAULT_PATHS).split(",").map((root)=>root.trim()).filter(Boolean))];return roots.length&&roots.length<=MAX_ROOTS&&roots.every((root)=>ROOT.test(root))?roots:null;};const validFees=(fees)=>Array.isArray(fees)&&fees.length>0&&fees.length<=MAX_ITEMS&&fees.every((fee)=>typeof fee?.feeType==="string"&&fee.feeType.trim().length>0&&fee.feeType.length<=100&&Number.isFinite(fee.amount)&&fee.amount>=0&&(fee.paidTo===undefined||(typeof fee.paidTo==="string"&&fee.paidTo.length<=200)));const validConditions=(conditions)=>Array.isArray(conditions)&&conditions.length>0&&conditions.length<=MAX_ITEMS&&conditions.every((condition)=>typeof condition?.description==="string"&&condition.description.trim().length>0&&condition.description.length<=200&&typeof condition?.status==="string"&&condition.status.trim().length>0&&condition.status.length<=50&&(condition.category===undefined||(typeof condition.category==="string"&&condition.category.length<=100))&&(condition.borrowerVisible===undefined||typeof condition.borrowerVisible==="boo
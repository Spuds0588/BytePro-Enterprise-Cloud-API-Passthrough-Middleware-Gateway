unt,...(fee.paidTo===undefined?{}:{PaidTo:fee.paidTo})}))};}const createdAt=new Date(now()).toISOString();const job={jobId:`job_${randomUUID()}`,loanId,apiKeyId,tenantName:tenant.tenantName,persona:tenant.persona,role:tenant.role,kind,status:"PENDING",attempts:0,error:null,createdAt,updatedAt:createdAt,ttl:Math.floor(now()/1000)+JOB_TTL_SECONDS};await store.putJob(job);try{await store.enqueueWrite({jobId:job.jobId,loanId,kind,payload});}catch(err){await store.putJob({...job,status:"FAILED",error:"Queue unavailable",updatedAt:new Date(now()).toISOString()});log("ERROR","WRITE_ENQUEUE_FAILED",{jobId:job.jobId,loanId,message:err.message});return error(503,"Write queue unavailable");}log("INFO","WRITE_ENQUEUED",{jobId:job.jobId,loanId,tenantName:tenant.tenantName,kind});return json(202,{status:"ACCEPTED",jobId:job.jobId,loanId,statusUrl:`/v1/jobs/${job.jobId}`});}async function readDocuments(apiKeyId,loanId,documentId){const tenant=await tenantFor(apiKeyId);if(!tenant)return error(403,"Unauthorized tenant mapping");if(!DOCUMENT_PERSONAS.includes(tenant.persona))return error(403,"Persona cannot read documents");let upstream;try{upstream=documentId?await byte.downloadDocument(tenant.role,loanId,documentId):await byte.listDocuments(tenant.role,loanId);}catch(err){log("ERROR","BYTEPRO_DOCUMENT_FAILED",{loanId,message:err.message});return error(err.name==="TimeoutError"?504:502,"BytePro document request failed");}log("INFO","BYTEPRO_DOCUMENT_READ",{loanId,status:upstream.status,single:Boolean(documentId)});const failed=upstreamError(upstream.status,loanId);if(failed)return failed;if(documentId){const contentBase64=documentContent(upstream.body);if(!contentBase64)return error(502,"BytePro returned no document content");return json(200,{documentId,contentType:"application/pdf",contentBase64});}return json(200,{loanId,documents:documentList(upstream.body)},{"Cache-Control":"private, max-age=15"});}async function jobStatus(apiKeyId,jobId){const tenant=await tenantFor(apiKeyId);i